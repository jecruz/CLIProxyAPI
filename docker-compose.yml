name: llmdynamix-engine

services:
  llmdynamix-engine:
    image: ${LLM_DYNAMIX_ENGINE_IMAGE:-llmdynamix-engine:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llmdynamix-engine
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "12445:12445"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${LLM_DYNAMIX_CONFIG_PATH:-./config.yaml}:/llmdynamix/config.yaml
      - ${LLM_DYNAMIX_AUTH_PATH:-./auths}:/root/.llmdynamix
      - ${LLM_DYNAMIX_LOG_PATH:-./logs}:/llmdynamix/logs
    restart: unless-stopped
