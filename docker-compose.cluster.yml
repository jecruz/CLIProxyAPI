name: llmdynamix-engine

services:
  llmdynamix-engine:
    image: ${LLM_DYNAMIX_ENGINE_IMAGE:-llmdynamix-engine:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llmdynamix-engine-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "12445:12445"
    volumes:
      - ./home:/root/.llmdynamix
      - ./logs:/llmdynamix/logs
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./llmdynamix-engine -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
